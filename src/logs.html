<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self';" />
  <title>SpectorClient Logs</title>
  <link rel="stylesheet" href="logs.css" />
</head>
<body>
  <div class="log-shell">
    <header class="log-head" aria-label="SpectorClient log window">
      <div class="brand" aria-label="SpectorClient Logs">
        <div class="brand-wordmark"><span>Spector</span><b>Client</b></div>
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-section">Logs</span>
      </div>
      <div class="actions">
        <span class="live-indicator"><span class="live-dot" aria-hidden="true"></span>Live console</span>
        <label class="auto-scroll-control"><input id="autoScroll" type="checkbox" checked aria-label="Auto-scroll" /> <span>Auto-scroll</span></label>
        <button id="clearBtn" type="button">Clear logs</button>
      </div>
    </header>

    <section class="log-toolbar" aria-label="Search and filter logs">
      <div class="log-search-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m15.6 15.6 4.7 4.7"/></svg>
        <label for="logSearch" class="sr-only">Search logs</label>
        <input id="logSearch" type="search" placeholder="Search output..." autocomplete="off" />
      </div>
      <div class="log-filter-bars">
        <div class="filter-group" aria-label="Log source filters">
          <button class="filter-chip active" type="button" data-source="all" aria-pressed="true">All sources</button>
          <button class="filter-chip" type="button" data-source="launcher" aria-pressed="false">Launcher</button>
          <button class="filter-chip" type="button" data-source="game" aria-pressed="false">Game</button>
          <button class="filter-chip" type="button" data-source="updater" aria-pressed="false">Updater</button>
          <button class="filter-chip" type="button" data-source="debug" aria-pressed="false">Debug</button>
        </div>
        <span class="filter-divider" aria-hidden="true"></span>
        <div class="filter-group level-filters" aria-label="Log severity filters">
          <button class="filter-chip active" type="button" data-level="all" aria-pressed="true">All levels</button>
          <button class="filter-chip" type="button" data-level="info" aria-pressed="false">Info</button>
          <button class="filter-chip" type="button" data-level="warn" aria-pressed="false">Warn</button>
          <button class="filter-chip" type="button" data-level="error" aria-pressed="false">Error</button>
          <button class="filter-chip" type="button" data-level="debug" aria-pressed="false">Debug</button>
        </div>
      </div>
    </section>

    <section class="log-summary" aria-label="Log statistics">
      <div><span>Total events</span><b id="totalCount">0</b></div>
      <div><span>Showing</span><b id="visibleCount">0</b></div>
      <div><span>Warnings</span><b id="warningCount">0</b></div>
      <div><span>Errors</span><b id="errorCount">0</b></div>
      <div class="log-state"><span>Stream</span><b><span class="status-pulse" aria-hidden="true"></span><span id="streamState">Live</span></b></div>
    </section>

    <main class="log-main">
      <section class="log-console" aria-label="Minecraft and launcher output">
        <div class="console-head">
          <div class="console-title"><span class="console-title-mark" aria-hidden="true"></span><h1>Console output</h1><span class="console-subtitle">Launcher · Minecraft · Updater</span></div>
          <span class="console-format">LIVE OUTPUT</span>
        </div>
        <div id="logOutput" class="log-output" role="log" aria-label="Live log messages" aria-live="off">
          <div class="log-empty">No logs yet.</div>
        </div>
      </section>
    </main>
  </div>
  <script src="logs.js"></script>
</body>
</html>
