name: Release SpectorClient for Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: spectorclient-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify tag matches package version
        id: version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $expected = "v$version"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag ${{ github.ref_name }} does not match package.json version $expected"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check launcher
        shell: pwsh
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js
          node --check src/logs.js

      - name: Build NSIS updater artifacts
        run: npm run build:release

      - name: Verify updater artifacts before publishing
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $exe = "dist/SpectorClient-$version-x64.exe"
          $blockmap = "$exe.blockmap"
          $latestPath = "dist/latest.yml"
          $required = @($exe, $blockmap, $latestPath)

          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Required update artifact is missing: $file" }
            $size = (Get-Item -LiteralPath $file).Length
            if ($size -le 0) { throw "Required update artifact is empty: $file" }
            Write-Host "Verified $file ($size bytes)"
          }

          $latest = Get-Content -LiteralPath $latestPath -Raw
          if ($latest -notmatch "(?m)^version:\s*$([regex]::Escape($version))\s*$") {
            throw "latest.yml does not advertise version $version"
          }
          if ($latest -notmatch [regex]::Escape("SpectorClient-$version-x64.exe")) {
            throw "latest.yml does not reference the expected installer"
          }

          $sha512Line = [regex]::Match($latest, '(?m)^\s*sha512:\s*([^\r\n]+)')
          if (-not $sha512Line.Success) { throw 'latest.yml does not contain an installer sha512' }
          $manifestSha512 = $sha512Line.Groups[1].Value.Trim().Trim('"').Trim("'")
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $hash = [System.Security.Cryptography.SHA512]::HashData($bytes)
          $actualSha512 = [Convert]::ToBase64String($hash)
          if ($actualSha512 -ne $manifestSha512) {
            throw 'latest.yml sha512 does not match the built installer'
          }
          Write-Host 'latest.yml checksum matches the NSIS installer.'

      - name: Remove stale failed draft releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # v1.6.5 and v1.6.6 failed after creating drafts because draft releases
          # are not returned by /releases/tags/{tag}. Remove those known failed drafts.
          $staleTags = @('v1.6.5', 'v1.6.6', 'v1.6.7', 'v1.6.8')
          $releases = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          foreach ($staleTag in $staleTags) {
            $matches = @($releases | Where-Object { $_.draft -eq $true -and $_.tag_name -eq $staleTag })
            foreach ($release in $matches) {
              Write-Host "Removing stale failed draft $staleTag (release id $($release.id))..."
              gh api -X DELETE "repos/${{ github.repository }}/releases/$($release.id)"
              if ($LASTEXITCODE -ne 0) { throw "Could not remove stale draft release $staleTag" }
            }
          }

      - name: Create clean draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.version.outputs.version }}"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Removing existing release object for $tag before rebuilding it..."
            gh release delete $tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not remove the existing release for $tag" }
          }

          gh release create $tag --draft --title "SpectorClient $version" --target "${{ github.sha }}" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Could not create draft release $tag" }

      - name: Upload all updater artifacts to draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.version.outputs.version }}"
          gh release upload $tag `
            "dist/SpectorClient-$version-x64.exe" `
            "dist/SpectorClient-$version-x64.exe.blockmap" `
            "dist/latest.yml" `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload release artifacts for $tag" }

      - name: Verify uploaded draft assets and digests
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.version.outputs.version }}"
          $expectedFiles = @(
            "SpectorClient-$version-x64.exe",
            "SpectorClient-$version-x64.exe.blockmap",
            "latest.yml"
          )

          # IMPORTANT: /releases/tags/{tag} returns 404 for draft releases.
          # Ask gh release view for the draft's database ID, then query by ID.
          $viewJson = gh release view $tag --json databaseId,tagName,isDraft
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve draft release $tag" }
          $view = $viewJson | ConvertFrom-Json
          if ($view.tagName -ne $tag) { throw "Resolved release tag is $($view.tagName), expected $tag" }
          if (-not $view.isDraft) { throw "Release $tag must still be a draft during verification" }
          if (-not $view.databaseId) { throw "Draft release $tag has no database ID" }

          $release = gh api "repos/${{ github.repository }}/releases/$($view.databaseId)" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not read draft release $tag by ID" }
          $assets = @($release.assets)

          foreach ($name in $expectedFiles) {
            $asset = $assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if (-not $asset) { throw "Draft release is missing required asset: $name" }
            if ([int64]$asset.size -le 0) { throw "Draft release asset is empty: $name" }
            Write-Host "Draft contains $name ($($asset.size) bytes)"
          }

          $exeName = "SpectorClient-$version-x64.exe"
          $exeAsset = $assets | Where-Object { $_.name -eq $exeName } | Select-Object -First 1
          if ($exeAsset.digest -and $exeAsset.digest -match '^sha256:(.+)$') {
            $remoteSha = $Matches[1].ToLowerInvariant()
            $localSha = (Get-FileHash "dist/$exeName" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($remoteSha -ne $localSha) { throw 'Uploaded installer SHA256 does not match the local build' }
            Write-Host 'Uploaded installer digest matches the local build.'
          }

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish verified release $tag" }

      - name: Verify published auto-update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.version.outputs.version }}"
          $expected = @(
            "latest.yml",
            "SpectorClient-$version-x64.exe",
            "SpectorClient-$version-x64.exe.blockmap"
          )
          $headers = @{
            'Cache-Control' = 'no-cache'
            'Pragma' = 'no-cache'
            'User-Agent' = 'SpectorClient-Release-Verification'
          }

          # First verify GitHub itself sees this tag as a normal published release
          # and that all updater assets are attached to exactly this release.
          $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Published release $tag cannot be read from GitHub" }
          if ($release.tag_name -ne $tag) { throw "Published release tag is $($release.tag_name), expected $tag" }
          if ($release.draft -or $release.prerelease) { throw "Release $tag is not a normal published release" }

          $assetNames = @($release.assets | ForEach-Object { $_.name })
          foreach ($required in $expected) {
            if ($assetNames -notcontains $required) { throw "Published release is missing $required" }
          }

          # Verify the exact-tag URLs that electron-updater ultimately downloads.
          # Do NOT use /releases/latest/download here: GitHub can cache/lag that
          # convenience redirect for minutes after a new release is published.
          $metadataUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/latest.yml"
          $installerUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/SpectorClient-$version-x64.exe"

          # GitHub serves latest.yml as application/octet-stream. In PowerShell 7,
          # Invoke-WebRequest can expose that body as Byte[], and casting Byte[]
          # to [string] produces "System.Byte[]" instead of the YAML text. Download
          # it to disk first, then read the actual UTF-8 text.
          $verifyDir = Join-Path $env:RUNNER_TEMP "spector-update-verify-$version"
          New-Item -ItemType Directory -Force -Path $verifyDir | Out-Null
          $metadataFile = Join-Path $verifyDir 'latest.yml'
          Remove-Item -LiteralPath $metadataFile -Force -ErrorAction SilentlyContinue

          $metadata = Invoke-WebRequest -Uri $metadataUrl -Headers $headers -MaximumRedirection 10 -OutFile $metadataFile -PassThru
          if ($metadata.StatusCode -ne 200) { throw "Tagged latest.yml returned HTTP $($metadata.StatusCode)" }
          if (-not (Test-Path -LiteralPath $metadataFile)) { throw 'Tagged latest.yml was not downloaded' }
          if ((Get-Item -LiteralPath $metadataFile).Length -le 0) { throw 'Tagged latest.yml download is empty' }

          $latestText = Get-Content -LiteralPath $metadataFile -Raw -Encoding UTF8
          if ($latestText -notmatch "(?m)^version:\s*$([regex]::Escape($version))\s*$") { throw "Tagged latest.yml is not version $version" }
          if ($latestText -notmatch [regex]::Escape("SpectorClient-$version-x64.exe")) { throw 'Tagged latest.yml points to the wrong installer' }

          # Verify the installer URL resolves without downloading the full EXE.
          $installerHead = Invoke-WebRequest -Uri $installerUrl -Method Head -Headers $headers -MaximumRedirection 10
          if ($installerHead.StatusCode -lt 200 -or $installerHead.StatusCode -ge 400) { throw "Tagged installer returned HTTP $($installerHead.StatusCode)" }

          # The API's latest-release pointer is what matters for discovery. It can
          # take a few seconds to update, so poll that API directly instead of the
          # cached /releases/latest/download shortcut. Never re-draft a valid
          # release merely because the shortcut CDN is still serving an old asset.
          $latestOk = $false
          $lastSeen = $null
          for ($attempt = 1; $attempt -le 24; $attempt++) {
            $apiLatest = gh api "repos/${{ github.repository }}/releases/latest" | ConvertFrom-Json
            if ($LASTEXITCODE -eq 0) {
              $lastSeen = $apiLatest.tag_name
              if ($apiLatest.tag_name -eq $tag -and -not $apiLatest.draft -and -not $apiLatest.prerelease) {
                $latestOk = $true
                break
              }
            }
            Write-Host "Waiting for GitHub latest-release API to point to $tag (currently $lastSeen)..."
            Start-Sleep -Seconds 5
          }

          if (-not $latestOk) {
            throw "GitHub latest-release API did not move to $tag (last seen: $lastSeen). The release remains published for inspection."
          }

          Write-Host "Auto-update release verified for SpectorClient $version." -ForegroundColor Green
          Write-Host "Metadata: $metadataUrl" -ForegroundColor DarkGreen
          Write-Host "Installer: $installerUrl" -ForegroundColor DarkGreen
