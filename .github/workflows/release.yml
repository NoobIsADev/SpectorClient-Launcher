name: Release SpectorClient for Windows + Linux

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: spectorclient-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows NSIS
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expected = "v$($package.version)"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag ${{ github.ref_name }} does not match package.json version $expected"
          }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check launcher
        shell: pwsh
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js
          node --check src/logs.js
          node --check scripts/fetch-brand.js

      - name: Build Windows updater artifacts
        run: npm run release:win

      - name: Verify Windows updater artifacts
        shell: pwsh
        run: |
          $version = [string](Get-Content package.json -Raw | ConvertFrom-Json).version
          $exe = "dist/SpectorClient-$version-x64.exe"
          $blockmap = "$exe.blockmap"
          $latestPath = 'dist/latest.yml'
          foreach ($file in @($exe, $blockmap, $latestPath)) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing Windows release file: $file" }
            if ((Get-Item -LiteralPath $file).Length -le 0) { throw "Empty Windows release file: $file" }
          }

          $latest = Get-Content -LiteralPath $latestPath -Raw
          if ($latest -notmatch "(?m)^version:\s*$([regex]::Escape($version))\s*$") { throw "latest.yml does not advertise $version" }
          if ($latest -notmatch [regex]::Escape("SpectorClient-$version-x64.exe")) { throw 'latest.yml points to the wrong Windows installer' }

          $sha = [regex]::Match($latest, '(?m)^\s*sha512:\s*([^\r\n]+)')
          if (-not $sha.Success) { throw 'latest.yml does not contain sha512' }
          $expectedSha = $sha.Groups[1].Value.Trim().Trim('"').Trim("'")
          $actualSha = [Convert]::ToBase64String([System.Security.Cryptography.SHA512]::HashData([System.IO.File]::ReadAllBytes((Resolve-Path $exe))))
          if ($expectedSha -ne $actualSha) { throw 'Windows installer sha512 does not match latest.yml' }

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: spectorclient-windows-release
          if-no-files-found: error
          retention-days: 2
          path: |
            dist/SpectorClient-*-x64.exe
            dist/SpectorClient-*-x64.exe.blockmap
            dist/latest.yml

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match v${version}"; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check launcher
        shell: bash
        run: |
          set -euo pipefail
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js
          node --check src/logs.js
          node --check scripts/fetch-brand.js

      - name: Build Linux AppImage updater artifacts
        run: npm run release:linux

      - name: Verify Linux updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          appimage="dist/SpectorClient-${version}-x86_64.AppImage"
          metadata="dist/latest-linux.yml"
          test -s "$appimage" || { echo "Missing/empty $appimage"; exit 1; }
          test -s "$metadata" || { echo "Missing/empty $metadata"; exit 1; }
          chmod +x "$appimage"

          VERSION="$version" APPIMAGE_PATH="$appimage" METADATA_PATH="$metadata" node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const version = process.env.VERSION;
          const appImage = process.env.APPIMAGE_PATH;
          const metadataPath = process.env.METADATA_PATH;
          const metadata = fs.readFileSync(metadataPath, 'utf8');
          if (!new RegExp(`^version:\\s*${version.replace(/\\./g, '\\\\.')}\\s*$`, 'm').test(metadata)) {
            throw new Error(`latest-linux.yml does not advertise ${version}`);
          }
          const expectedName = `SpectorClient-${version}-x86_64.AppImage`;
          if (!metadata.includes(expectedName)) throw new Error('latest-linux.yml points to the wrong AppImage');
          const match = metadata.match(/^\s*sha512:\s*([^\r\n]+)/m);
          if (!match) throw new Error('latest-linux.yml does not contain sha512');
          const expected = match[1].trim().replace(/^['"]|['"]$/g, '');
          const actual = crypto.createHash('sha512').update(fs.readFileSync(appImage)).digest('base64');
          if (expected !== actual) throw new Error('Linux AppImage sha512 does not match latest-linux.yml');
          NODE

      - name: Upload Linux release files
        uses: actions/upload-artifact@v4
        with:
          name: spectorclient-linux-release
          if-no-files-found: error
          retention-days: 2
          path: |
            dist/SpectorClient-*-x86_64.AppImage
            dist/latest-linux.yml

  publish-release:
    name: Publish verified Windows + Linux release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify complete cross-platform release set
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected=(
            "dist/SpectorClient-${version}-x64.exe"
            "dist/SpectorClient-${version}-x64.exe.blockmap"
            "dist/latest.yml"
            "dist/SpectorClient-${version}-x86_64.AppImage"
            "dist/latest-linux.yml"
          )
          for file in "${expected[@]}"; do
            test -s "$file" || { echo "Release file missing or empty: $file"; exit 1; }
            echo "Verified $file ($(stat -c%s "$file") bytes)"
          done

      - name: Remove stale/current draft release objects
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          # Remove a release object for this tag if a previous attempt left one.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi

          # Clean the known failed drafts from the earlier updater pipeline.
          releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          for stale in v1.6.5 v1.6.6 v1.6.7 v1.6.8; do
            ids="$(printf '%s' "$releases" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{for(const r of JSON.parse(s)){if(r.draft&&r.tag_name===process.argv[1]) console.log(r.id)}})" "$stale")"
            while IFS= read -r id; do
              [ -z "$id" ] || gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"
            done <<< "$ids"
          done

      - name: Create clean draft release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          gh release create "${GITHUB_REF_NAME}" --draft --title "SpectorClient ${version}" --target "${GITHUB_SHA}" --generate-notes

      - name: Upload all Windows and Linux updater files
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/SpectorClient-${version}-x64.exe" \
            "dist/SpectorClient-${version}-x64.exe.blockmap" \
            "dist/latest.yml" \
            "dist/SpectorClient-${version}-x86_64.AppImage" \
            "dist/latest-linux.yml" \
            --clobber

      - name: Verify draft release assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          view="$(gh release view "${GITHUB_REF_NAME}" --json databaseId,tagName,isDraft)"
          release_id="$(printf '%s' "$view" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).databaseId")"
          is_draft="$(printf '%s' "$view" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).isDraft")"
          test "$is_draft" = "true" || { echo 'Release must still be draft during verification'; exit 1; }

          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          RELEASE_JSON="$release" VERSION="$version" node <<'NODE'
          const release = JSON.parse(process.env.RELEASE_JSON);
          const v = process.env.VERSION;
          const expected = [
            `SpectorClient-${v}-x64.exe`,
            `SpectorClient-${v}-x64.exe.blockmap`,
            'latest.yml',
            `SpectorClient-${v}-x86_64.AppImage`,
            'latest-linux.yml'
          ];
          const assets = new Map((release.assets || []).map(a => [a.name, a]));
          for (const name of expected) {
            const asset = assets.get(name);
            if (!asset || Number(asset.size) <= 0) throw new Error(`Draft release is missing/empty: ${name}`);
            console.log(`Draft contains ${name} (${asset.size} bytes)`);
          }
          NODE

      - name: Publish verified release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest

      - name: Verify public Windows + Linux auto-update endpoints
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          verify_dir="${RUNNER_TEMP}/spector-release-verify-${version}"
          mkdir -p "$verify_dir"

          curl -fL --retry 5 --retry-all-errors -H 'Cache-Control: no-cache' -A 'SpectorClient-Release-Verification' \
            "$base/latest.yml" -o "$verify_dir/latest.yml"
          curl -fL --retry 5 --retry-all-errors -H 'Cache-Control: no-cache' -A 'SpectorClient-Release-Verification' \
            "$base/latest-linux.yml" -o "$verify_dir/latest-linux.yml"

          grep -Eq "^version:[[:space:]]*${version}[[:space:]]*$" "$verify_dir/latest.yml"
          grep -Fq "SpectorClient-${version}-x64.exe" "$verify_dir/latest.yml"
          grep -Eq "^version:[[:space:]]*${version}[[:space:]]*$" "$verify_dir/latest-linux.yml"
          grep -Fq "SpectorClient-${version}-x86_64.AppImage" "$verify_dir/latest-linux.yml"

          curl -fLsSI --retry 5 --retry-all-errors -A 'SpectorClient-Release-Verification' \
            "$base/SpectorClient-${version}-x64.exe" >/dev/null
          curl -fLsSI --retry 5 --retry-all-errors -A 'SpectorClient-Release-Verification' \
            "$base/SpectorClient-${version}-x86_64.AppImage" >/dev/null

          latest_ok=0
          last_seen=''
          for attempt in $(seq 1 24); do
            latest_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")"
            last_seen="$(printf '%s' "$latest_json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).tag_name")"
            if [ "$last_seen" = "$tag" ]; then
              latest_ok=1
              break
            fi
            echo "Waiting for latest release pointer to move to $tag (currently $last_seen)..."
            sleep 5
          done
          test "$latest_ok" = 1 || { echo "Latest release pointer did not move to $tag (last seen $last_seen)"; exit 1; }

          echo "Windows and Linux updater endpoints verified for SpectorClient ${version}."
